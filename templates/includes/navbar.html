{% load static %}

<style>
    /* Regras exclusivas para o menu no celular */
    @media (max-width: 991px) {
        #menuLateral {
            max-width: 70%;
        }
        #menuLateral .navbar-nav {
            align-items: center;
            width: 100%;
        }
        #menuLateral .nav-item {
            width: 100%;
        }
        #menuLateral .nav-link:not(.btn-doar-nav) {
            color: var(--verde-oliva) !important; 
            background-color: rgba(162, 181, 72, 0.08); 
            text-align: center !important; 
            border-radius: 8px; 
            margin-bottom: 12px; 
            font-weight: 700;
        }
        #menuLateral .nav-link:not(.btn-doar-nav):hover,
        #menuLateral .nav-link:not(.btn-doar-nav):active {
            background-color: rgba(162, 181, 72, 0.2); 
        }
        .item-menu-mobile {
            border-bottom: none !important;
        }
    }
    
    /* Regras exclusivas para o computador - Efeito Sublinhado Animado */
    @media (min-width: 992px) {
        .item-menu-mobile {
            border-bottom: none !important;
        }
        
        #menuLateral .nav-link:not(.btn-doar-nav) {
            background-color: transparent !important;
            position: relative;
            padding: 8px 0 !important; 
            margin: 0 15px; /* Respiro entre as opções */
            transition: color 0.3s ease;
        }

        /* Cria a linha invisível embaixo do texto */
        #menuLateral .nav-link:not(.btn-doar-nav)::after {
            content: '';
            position: absolute;
            width: 0;
            height: 2px;
            bottom: 0;
            left: 50%;
            background-color: white; 
            transition: all 0.3s ease;
            transform: translateX(-50%);
        }

        /* Faz a linha crescer do centro para as bordas quando passa o mouse */
        #menuLateral .nav-link:not(.btn-doar-nav):hover::after {
            width: 100%;
        }
    }
</style>

<nav class="navbar navbar-expand-lg navbar-dark navbar-viralate fixed-top shadow-sm">
    <div class="container"> 
        
        <a class="navbar-brand me-4" href="{% url 'home' %}">
            <img src="{% static 'img/Logo.png' %}" alt="Viralate" height="60">
        </a>

        <button class="navbar-toggler border-0 shadow-none" type="button" data-bs-toggle="offcanvas" data-bs-target="#menuLateral" aria-controls="menuLateral">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="offcanvas offcanvas-start bg-white" tabindex="-1" id="menuLateral" aria-labelledby="menuLateralLabel">
            
            <div class="offcanvas-header border-bottom mb-3 position-relative">
                <h5 class="offcanvas-title fw-bold text-uppercase w-100 text-center" style="color: var(--verde-oliva); letter-spacing: 1px;" id="menuLateralLabel">Menu</h5>
                <button type="button" class="btn-close position-absolute" data-bs-dismiss="offcanvas" aria-label="Fechar" style="right: 15px;"></button>
            </div>

            <div class="offcanvas-body px-4 px-lg-3">
                <ul class="navbar-nav ms-auto text-uppercase align-items-lg-center gap-lg-2" style="font-size: 0.85rem; letter-spacing: 0.5px;">
                    
                    <li class="nav-item item-menu-mobile">
                        <a class="nav-link py-3 py-lg-2" href="{% url 'enciclopet' %}">Enciclopet</a>
                    </li>
                    <li class="nav-item item-menu-mobile">
                        <a class="nav-link py-3 py-lg-2" href="{% url 'quem_somos' %}">Quem Somos</a>
                    </li>
                    <li class="nav-item item-menu-mobile">
                        <a class="nav-link py-3 py-lg-2" href="{% url 'adotar' %}">Adotar</a>
                    </li>
                    <li class="nav-item item-menu-mobile">
                        <a class="nav-link py-3 py-lg-2" href="{% url 'lares_temporarios' %}">Lares Temporários</a>
                    </li>
                    <li class="nav-item item-menu-mobile">
                        <a class="nav-link py-3 py-lg-2" href="{% url 'voluntariar' %}">Voluntariar</a>
                    </li>
                    <li class="nav-item item-menu-mobile">
                        <a class="nav-link py-3 py-lg-2" href="{% url 'contato' %}">Contato</a>
                    </li> 
                    
                    <li class="nav-item mt-2 mt-lg-0 ms-lg-3">
                        <a class="nav-link py-3 py-lg-2 btn-doar-nav w-100 text-center" href="{% url 'doar' %}">
                            Doar
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </div>
</nav>
